services:
  - type: web
    name: nidaa
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      gunicorn
      -k geventwebsocket.gunicorn.workers.GeventWebSocketWorker
      -w 1
      -b 0.0.0.0:$PORT
      server:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
